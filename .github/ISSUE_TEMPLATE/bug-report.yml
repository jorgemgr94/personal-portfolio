name: Bug report
description: Report a reproducible problem in the portfolio.
title: 'fix: '
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected, how often, and which page or feature is involved?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Production or local; browser, OS, viewport, and device when relevant
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add safe logs, screenshots, or recordings. Remove credentials and personal data.
