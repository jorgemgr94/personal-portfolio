name: Feature request
description: Propose a visitor-facing or maintenance improvement.
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which visitor, recruiter, or maintainer problem needs solving?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing an implementation.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Include important exclusions and affected pages or audiences.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: considerations
    attributes:
      label: Accessibility, performance, and privacy considerations
      description: Note expected effects on keyboard use, responsive layout, bundle size, analytics, or personal data.
